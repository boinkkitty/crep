version: "2"

run:
  timeout: 5m
  build-tags: [integration]

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - revive # maintained successor of golint
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - sqlclosecheck
    - rowserrcheck
    - unconvert
  settings:
    revive:
      rules:
        # golint's rule set, minus doc-comment nags on every exported identifier.
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: errorf
        - name: increment-decrement
        - name: var-declaration
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: superfluous-else
        - name: unreachable-code
        - name: redefines-builtin-id
    gosec:
      excludes:
        - G115 # int conversions: values are bounded by domain validation
  exclusions:
    presets: [std-error-handling]
    rules:
      - path: _test\.go
        linters: [gosec, noctx, bodyclose]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes: [crep]
